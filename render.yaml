services:
  - type: web
    name: popo-map
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: popo-db
          property: connectionString

databases:
  - name: popo-db
    plan: free
